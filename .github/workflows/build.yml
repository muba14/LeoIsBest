name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repoda android/ klasörü yoksa Flutter'ın kendi şablonuyla oluştur.
      # lib/, pubspec.yaml ve assets/ olduğu gibi korunur.
      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            flutter create --project-name leoisbest --org com.muba14 --platforms android .
          fi

      # Uygulama ikonu: hazır PNG'ler tool/android_icons/res içinde.
      # Ek paket gerekmez, sadece Android'in res klasörüne kopyalanır.
      - name: Install app icon
        run: cp -r tool/android_icons/res/. android/app/src/main/res/

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/leoisbest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leoisbest-apk
          path: build/app/outputs/flutter-apk/leoisbest.apk

      # v1.0.0 gibi bir tag push'larsan APK otomatik olarak Release'e eklenir
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/leoisbest.apk
